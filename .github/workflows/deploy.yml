name: Deploy MPN Phenotyping to GitHub Pages

# Builds the Vite app and publishes it to GitHub Pages on every push to the
# default branch. No manual build step needed. Enable once under
# Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs on new pushes.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The app is the repository root (this workflow lives at
    # .github/workflows/deploy.yml). If you instead nest the app in a subfolder,
    # restore a `defaults.run.working-directory:` and prefix the paths below.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
